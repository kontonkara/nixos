keys:
  - &kontonkara 
  - &alpha 
creation_rules:
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
      - age:
          - *kontonkara
          - *alpha
  # Binary sops payloads (LUKS keyfiles, keytabs, ...), one file = one secret.
  - path_regex: secrets/[^/.]+$
    key_groups:
      - age:
          - *kontonkara
          - *alpha